name: Android build
on:
  push:
    branches: [main]
    paths-ignore: ["CNCryto-debug.apk"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent APK publishers from racing to update the root APK.
concurrency:
  group: cncryto-android-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install host Python test dependencies
        run: python -m pip install numpy==2.3.2 pandas==2.3.2
      - name: Prepare and test Python engine
        run: |
          python scripts/prepare_python_engine.py --source forex_signal_system.zip --dest app/src/main/python
          python -m unittest discover -s tests/python -v
      - name: Assemble and test
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease testDebugUnitTest
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CNCryto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload minified release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CNCryto-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Publish APK to repository root
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CNCryto-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CNCryto-debug.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "chore: publish latest debug APK"
          git pull --rebase origin main
          git push origin HEAD:main
